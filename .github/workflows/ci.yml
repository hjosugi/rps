name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      strict_parameter_inventory:
        description: Fail on any difference across the entire upstream parameter inventory
        type: boolean
        default: false
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test, conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x64 and arm64, plus macOS arm64. The conformance check needs
        # no pwsh, so the same four commands run on every platform.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The conformance check compares rpsh with pwsh output recorded in the
      # repository, so it needs no pwsh here.
      - run: scripts/check.sh
      - name: Audit registered cmdlet parameter declarations
        if: matrix.os == 'ubuntu-latest'
        run: cargo harness inventory --check-parameters --registered-only
      - name: Report all upstream parameter differences
        if: matrix.os == 'ubuntu-latest'
        run: cargo harness inventory --parameters > parameter-inventory.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: parameter-inventory
          path: parameter-inventory.txt
      - name: Enforce the entire upstream parameter inventory
        if: matrix.os == 'ubuntu-latest' && inputs.strict_parameter_inventory
        run: cargo harness inventory --check-parameters

  dependencies:
    name: cargo deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
  pester-scorecard:
    name: pester scorecard skeleton
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Pester run yet: this renders the format and the area counts that
      # docs/07_pester_plan.md defines. A runner will feed --results later.
      - run: scripts/pester-scorecard.py --out pester-scorecard.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-scorecard
          path: pester-scorecard.md
