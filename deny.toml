# Dependency rules (#7, docs/07_dependencies.md).
#
# `cargo deny check` runs in CI's `dependencies` job; run it locally with
# `cargo deny check` (it is not part of `scripts/check.sh`). A crate that
# is added to the workspace must pass all four checks: its license is on the
# allow list, it has no advisory, it is not a duplicate brought in for no
# reason, and it comes from crates.io or a git source named here.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
]

[advisories]
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = []
# The workspace has no external dependency yet, so most allowances are
# unmatched. Keep them: they are the list a new crate is checked against.
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-workspace = true
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
