[package]
name = "rpsh-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# The fuzz crate has its own workspace so `cargo test --workspace` never
# builds libFuzzer. Run it with `cargo +nightly fuzz ...`.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
rpsh-syntax = { path = "../crates/rpsh-syntax" }

[[bin]]
name = "tokenize"
path = "fuzz_targets/tokenize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
